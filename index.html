<style>
  :root{
    /* brand: Comunidad Hogar — sage green + warm white, from comunidadhogar.es */
    --navy:#5E7150;       /* header / brand-dark block (their solid sage banners) */
    --navy-deep:#4A5A3F;
    --paper:#FAF8F2;      /* warm off-white background */
    --card:#FFFFFF;
    --ink:#2C3126;        /* warm charcoal, kept dark for chord-sheet legibility */
    --ink-soft:#707C63;
    --orange:#BC6C25;     /* clay accent — used only for chords/highlights, not brand chrome */
    --orange-deep:#9C5A1E;
    --sage:#7C8F6A;       /* primary brand green (logo + buttons) */
    --sage-light:#E9EEE1; /* tag / tint background */
    --border:#E4E1D2;
    --danger:#AE4236;
    --danger-bg:#F8E9E6;
    --shadow: 0 1px 2px rgba(44,49,38,.06), 0 4px 14px rgba(44,49,38,.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#8CA179;
      --navy-deep:#A7BB94;
      --paper:#181C15;
      --card:#232920;
      --ink:#ECEFE6;
      --ink-soft:#A6B098;
      --orange:#E29456;
      --orange-deep:#F0AC77;
      --sage:#9CB489;
      --sage-light:#2C3526;
      --border:#38412F;
      --danger:#E58177;
      --danger-bg:#3A2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --navy:#8CA179; --navy-deep:#A7BB94; --paper:#181C15; --card:#232920;
    --ink:#ECEFE6; --ink-soft:#A6B098; --orange:#E29456; --orange-deep:#F0AC77;
    --sage:#9CB489; --sage-light:#2C3526; --border:#38412F; --danger:#E58177; --danger-bg:#3A2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;

  .sheet .lyricrow{color:var(--ink); white-space:pre;}
  .sheet .section{color:var(--sage); font-weight:700; margin-top:10px; font-family:'Work Sans',sans-serif; font-size:12.5px; letter-spacing:.3px;}
  .sheet .spacer{height:10px;}
  .history-item{

  .toast{

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>

<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ---------------- Chord / key theory helpers ---------------- */
var NOTE_INDEX = {C:0,'B#':0,'C#':1,'Db':1,D:2,'D#':3,Eb:3,E:4,'Fb':4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,'Cb':11};
var SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var SOLFEGE_SHARP = {'C':'Do','C#':'Do#','D':'Re','D#':'Re#','E':'Mi','F':'Fa','F#':'Fa#','G':'Sol','G#':'Sol#','A':'La','A#':'La#','B':'Si'};
var SOLFEGE_FLAT  = {'C':'Do','Db':'Reb','D':'Re','Eb':'Mib','E':'Mi','F':'Fa','Gb':'Solb','G':'Sol','Ab':'Lab','A':'La','Bb':'Sib','B':'Si'};

function splitRoot(token){
  var m = token.match(/^([A-G])(#|b)?(.*)$/);
  if(!m) return null;
  return {note: m[1]+(m[2]||''), rest: m[3]||''};
}
function transposeToken(token, semitones, preferFlat){
  var parts = token.split('/');
  var out = parts.map(function(p){
    var s = splitRoot(p);
    if(!s || !(s.note in NOTE_INDEX)) return p;
    var idx = ((NOTE_INDEX[s.note] + semitones) % 12 + 12) % 12;
    var newNote = preferFlat ? FLATS[idx] : SHARPS[idx];
    return newNote + s.rest;
  });
  return out.join('/');
}
function toSolfege(token, preferFlat){
  var parts = token.split('/');
  var out = parts.map(function(p){
    var s = splitRoot(p);
    if(!s || !(s.note in NOTE_INDEX)) return p;
    var idx = NOTE_INDEX[s.note];
    var name = preferFlat ? SOLFEGE_FLAT[FLATS[idx]] : SOLFEGE_SHARP[SHARPS[idx]];
    return name + s.rest;
  });
  return out.join('/');
}
function displayChord(token, semitones, preferFlat, notation){
  var t = transposeToken(token, semitones || 0, !!preferFlat);
  return notation === 'solfege' ? toSolfege(t, !!preferFlat) : t;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---- Automatic chord-line recognition: no brackets needed.
   A chord goes on its own line, directly above the lyric line it
   belongs to — exactly like a chart on paper. ---- */
var CHORD_SUFFIXES = {};
['', 'm', 'min', 'maj', 'maj7', 'maj9', 'maj11', 'maj13', '6', 'm6', '6/9',
 '7', 'm7', '7sus2', '7sus4', '9', 'm9', '11', 'm11', '13', 'm13',
 'sus', 'sus2', 'sus4', 'add9', 'add11', 'add2', 'madd9',
 'dim', 'dim7', 'aug', 'aug7', '5', '2', '4', '9sus4',
 '7b5', '7#5', '7b9', '7#9', 'm7b5', 'm7#5', '9b5', '9#5',
 '13b9', '13#9', '7b13', '6add9', '+', 'o', 'ø'
].forEach(function(s){ CHORD_SUFFIXES[s.toLowerCase()] = true; });

function isChordToken(tok){
  if(/^(N\.?C\.?|%)$/i.test(tok)) return true; // "no chord" / repeat markers pass through
  var m = tok.match(/^([A-G])(#|b)?(.*)$/);
  if(!m) return false;
  var rest = m[3];
  var bass = rest.match(/^(.*)\/([A-G])(#|b)?$/);
  var suffix = bass ? bass[1] : rest;
  return Object.prototype.hasOwnProperty.call(CHORD_SUFFIXES, suffix.toLowerCase());
}
function isChordLine(trimmedLine){
  if(trimmedLine === '') return false;
  var tokens = trimmedLine.split(/\s+/);
  for(var i=0;i<tokens.length;i++){ if(!isChordToken(tokens[i])) return false; }
  return true;
}
/* Replace every chord token in a raw (unstripped) line, keeping original spacing. */
function transposeChordLine(line, semitones, preferFlat, notation){
  var parts = line.split(/(\s+)/);
  return parts.map(function(p){
    if(p === '' || /^\s+$/.test(p)) return p;
    return isChordToken(p) ? displayChord(p, semitones, preferFlat, notation) : p;
  }).join('');
}

function renderSheet(body, semitones, preferFlat, notation){
  if(!body || !body.trim()) return '<div class="empty" style="padding:20px;">Sin letra todavía.</div>';
  var lines = body.split('\n');
  var html = '';
  var i = 0;
  while(i < lines.length){
    var line = lines[i];
    var trimmed = line.trim();
    if(trimmed.indexOf('#') === 0){
      html += '<div class="section">'+escapeHtml(trimmed.replace(/^#+\s*/,''))+'</div>';
      i++; continue;
    }
    if(trimmed === ''){
      html += '<div class="spacer"></div>';
      i++; continue;
    }
    if(isChordLine(trimmed)){
      var chordHtml = escapeHtml(transposeChordLine(line, semitones, preferFlat, notation));
      var next = lines[i+1];
      var nextTrim = next !== undefined ? next.trim() : undefined;
      var pairsWithLyric = next !== undefined && nextTrim !== '' && nextTrim.indexOf('#') !== 0 && !isChordLine(nextTrim);
      html += '<div class="chordrow">'+chordHtml+'</div>';
      if(pairsWithLyric){
        html += '<div class="lyricrow">'+escapeHtml(next)+'</div>';
        i += 2;
      } else {
        i += 1;
      }
      continue;
    }
    html += '<div class="lyricrow">'+escapeHtml(line)+'</div>';
    i++;
  }
  return html;
}

/* ---------------- App state ---------------- */
var state = {
  tab: 'songs',
  songs: [],
  musicians: [],
  services: [],
  demo: false,
  songFilter: '',
  serviceFilter: 'proximos',
  view: null /* {type:'song'|'service'|'musician', id, ...transient ui state} */
};

var DEMO_SONG = {
  title: 'Canción de ejemplo',
  artist: 'Equipo de alabanza',
  key: 'G',
  tags: ['Adoración'],
  body: '# Verso\nG           D\nCantamos a tu nombre\nEm          C\ncon el corazón entero\nG        D       C   G\nToda la gloria es para ti\n\n# Coro\nC           G\nGrande es tu fidelidad\nD          Em    C   D\nhoy y para siempre',
  notes: 'Ejemplo generado para mostrar el formato: la línea de acordes va sola, justo arriba de la línea de letra que corresponde. Usa una línea que empiece con # para marcar secciones (Verso, Coro, Puente...).'
};

function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-ES', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}

var db = null;

/* ---------------- Rendering ---------------- */
var app = document.getElementById('app');
var modalRoot = document.getElementById('modalRoot');

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  if(state.tab === 'songs') renderSongsTab();
  else if(state.tab === 'services') renderServicesTab();
  else renderMusiciansTab();
  renderModal();
}

/* ---- Songs tab ---- */
function renderSongsTab(){
  var q = state.songFilter.trim().toLowerCase();
  var list = state.songs.filter(function(s){
    if(!q) return true;
    return (s.title||'').toLowerCase().indexOf(q) > -1 || (s.artist||'').toLowerCase().indexOf(q) > -1 ||
      (s.tags||[]).join(' ').toLowerCase().indexOf(q) > -1;

/* ---------------- Modal system ---------------- */
var scrollAnim = null; /* {raf, accum} — auto-scroll loop, lives outside state so re-renders don't kill it */
function stopAutoScroll(){
  if(scrollAnim){ cancelAnimationFrame(scrollAnim.raf); scrollAnim = null; }
}
function startAutoScroll(container, speed){
  stopAutoScroll();
  var last = null, accum = 0;
  function step(ts){
    if(last === null) last = ts;
    var dt = ts - last; last = ts;
    /* Accumulate fractional pixels separately — reading scrollTop back and
       adding a sub-pixel amount gets rounded away by the browser, which is
       why low speeds used to stall. Only ever write whole pixels. */
    accum += speed * 9 * dt / 1000; /* speed 1-10 -> ~9-90 px/s */
    var whole = Math.floor(accum);
    if(whole > 0){ container.scrollTop += whole; accum -= whole; }
    if(container.scrollTop + container.clientHeight >= container.scrollHeight - 1){
      stopAutoScroll();
      if(state.view){ state.view.scrolling = false; renderModal(); }
      return;
    }
    scrollAnim = {raf: requestAnimationFrame(step)};
  }
  scrollAnim = {raf: requestAnimationFrame(step)};
}
function closeModal(){ state.view = null; renderModal(); }
function renderModal(){
  var prevContainer = modalRoot.querySelector('.scroll-area') || modalRoot.querySelector('.modal');
  var prevScrollTop = prevContainer ? prevContainer.scrollTop : 0;
  stopAutoScroll();
  if(!state.view){ modalRoot.innerHTML=''; return; }
  var v = state.view;
  var body = '';
  if(v.type === 'songDetail') body = songDetailModal(v);
  else if(v.type === 'songForm') body = songFormModal(v);
  else if(v.type === 'serviceDetail') body = serviceDetailModal(v);
  else if(v.type === 'servicePlayer') body = servicePlayerModal(v);
  else if(v.type === 'songPlayer') body = songPlayerModal(v);
  else if(v.type === 'musicianForm') body = musicianFormModal(v);
  else if(v.type === 'songPicker') body = songPickerModal(v);
  else if(v.type === 'musicianPicker') body = musicianPickerModal(v);
  var modalClass = 'modal rel' + (v.type === 'songPlayer' ? ' has-fixed-top' : '');
  modalRoot.innerHTML = '<div class="modal-back" id="modalBack"><div class="'+modalClass+'">'+
    '<button class="close-x" id="modalClose" aria-label="Cerrar">✕</button>'+body+'</div></div>';
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', function(e){ if(e.target.id==='modalBack') closeModal(); });
  wireModal(v);
  if(v.type === 'songPlayer'){
    var container = modalRoot.querySelector('.scroll-area');
    if(container){
      container.scrollTop = prevScrollTop; /* stay put — including once auto-scroll stops at the end */
      if(v.scrolling) startAutoScroll(container, v.scrollSpeed || 4);
    }
  }
}

/* ---- Song player: performance view for one song within a culto's setlist —
   transpose + auto-scroll live here, plus swipe/arrows to move between songs. ---- */
function rootPitchClass(token){
  if(!token) return null;
  var s = splitRoot(token.split('/')[0]);
  if(!s || !(s.note in NOTE_INDEX)) return null;
  return NOTE_INDEX[s.note];
}
function semitoneDiff(fromToken, toToken){
  var f = rootPitchClass(fromToken), t = rootPitchClass(toToken);
  if(f === null || t === null) return 0;
  var diff = ((t - f) % 12 + 12) % 12;
  if(diff > 6) diff -= 12;
  return diff;
}
function openSongPlayer(serviceId, index){
  var prev = (state.view && state.view.type === 'songPlayer') ? state.view : null;
  var sv = state.services.find(function(x){ return x.id===serviceId; });
  var entry = sv && sv.songs && sv.songs[index];
  if(!entry) return;
  var song = state.songs.find(function(x){ return x.id===entry.songId; });
  state.view = {
    type:'songPlayer', serviceId:serviceId, index:index,
    semitones: song ? semitoneDiff(song.key||'', entry.key||song.key||'') : 0,
    preferFlat: /b/.test(entry.key||'') && !/#/.test(entry.key||''),
    notation: prev ? prev.notation : 'letters',
    scrolling:false,
    scrollSpeed: prev ? prev.scrollSpeed : 4,
    controlsOpen: prev ? prev.controlsOpen : false
  };
  renderModal();
}

  top += '<div class="transpose-bar">'+
    '<button class="round-btn" data-tr="-1" aria-label="Bajar semitono">−</button>'+

    '<button class="chip-toggle" data-notation="toggle">'+(v.notation==='solfege'?'Do-Re-Mi':'A-B-C')+'</button>'+
  '</div>';
  top += '<div class="scroll-bar">'+

  var scroll = '<div class="sheet">'+(s ? renderSheet(s.body, v.semitones, v.preferFlat, v.notation) : '<div class="empty">Esta canción ya no existe en el cancionero.</div>')+'</div>';

}

/* ---- musician form ---- */
function openMusicianForm(id){
  var m = id ? state.musicians.find(function(x){return x.id===id;}) : null;
  state.view = {type:'musicianForm', id:id||null, draft: m ? Object.assign({}, m) : {name:'',role:'',phone:'',notes:''}};
  renderModal();
}
function musicianFormModal(v){
  var d = v.draft;
  return '<h3>'+(v.id?'Editar músico':'Nuevo músico')+'</h3>'+
    '<div class="field"><label for="m_name">Nombre</label><input type="text" id="m_name" value="'+escapeHtml(d.name)+'"></div>'+
    '<div class="field"><label for="m_role">Instrumento / rol</label><input type="text" id="m_role" value="'+escapeHtml(d.role)+'" placeholder="Guitarra, Voz, Batería, Bajo, Teclado…"></div>'+
    '<div class="field"><label for="m_phone">Teléfono (opcional)</label><input type="tel" id="m_phone" value="'+escapeHtml(d.phone||'')+'"></div>'+
    '<div class="field"><label for="m_notes">Notas (opcional)</label><textarea id="m_notes" rows="2">'+escapeHtml(d.notes||'')+'</textarea></div>'+
    '<div class="modal-actions">'+
      (v.id ? '<button class="btn danger small" id="delMusician">Eliminar</button>' : '<span></span>')+
      '<button class="btn primary" id="saveMusician">Guardar</button>'+
    '</div>';
}

/* ---------------- Modal wiring ---------------- */
function wireModal(v){
  if(v.type === 'songDetail'){
    var s = state.songs.find(function(x){return x.id===v.id;});
    var editBtn = document.getElementById('editSong');
    if(editBtn) editBtn.addEventListener('click', function(){ openSongForm(v.id); });
    var delBtn = document.getElementById('delSong');
    if(delBtn) delBtn.addEventListener('click', function(){
      if(confirm('¿Eliminar "'+(s?s.title:'')+'"? Esta acción no se puede deshacer.')) deleteSong(v.id);
    });
  }
  else if(v.type === 'servicePlayer'){
    modalRoot.querySelectorAll('[data-open-player]').forEach(function(el){
      el.addEventListener('click', function(){
        openSongPlayer(v.id, +el.getAttribute('data-open-player'));
      });
    });
    var editServiceBtn = document.getElementById('editService');
    if(editServiceBtn) editServiceBtn.addEventListener('click', function(){ openServiceDetail(v.id); });
  }
  else if(v.type === 'songPlayer'){
    modalRoot.querySelectorAll('[data-tr]').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-tr');
        if(t==='reset') v.semitones = 0; else v.semitones += parseInt(t,10);
        renderModal();
      });
    });
    var flatBtn = modalRoot.querySelector('[data-flat]');
    if(flatBtn) flatBtn.addEventListener('click', function(){ v.preferFlat = !v.preferFlat; renderModal(); });
    var notBtn = modalRoot.querySelector('[data-notation]');
    if(notBtn) notBtn.addEventListener('click', function(){ v.notation = v.notation==='solfege' ? 'letters' : 'solfege'; renderModal(); });
    var controlsToggle = document.getElementById('controlsToggle');
    if(controlsToggle) controlsToggle.addEventListener('click', function(){
      v.controlsOpen = !v.controlsOpen;
      renderModal();
    });
    var scrollBtn = document.getElementById('scrollToggle');
    if(scrollBtn) scrollBtn.addEventListener('click', function(){
      v.scrolling = !v.scrolling;
      renderModal();
    });
    function applySpeed(newSpeed){
      v.scrollSpeed = Math.max(1, Math.min(10, newSpeed));
      var range = document.getElementById('scrollSpeed');
      var label = document.getElementById('speedLabel');
      if(range) range.value = v.scrollSpeed;
      if(label) label.textContent = 'Vel. '+v.scrollSpeed;
      if(v.scrolling){
        var container = modalRoot.querySelector('.scroll-area');
        if(container) startAutoScroll(container, v.scrollSpeed);
      }
    }
    var speedRange = document.getElementById('scrollSpeed');
    if(speedRange) speedRange.addEventListener('input', function(e){ applySpeed(+e.target.value); });
    var speedDown = document.getElementById('speedDown');
    if(speedDown) speedDown.addEventListener('click', function(){ applySpeed((v.scrollSpeed||4) - 1); });
    var speedUp = document.getElementById('speedUp');
    if(speedUp) speedUp.addEventListener('click', function(){ applySpeed((v.scrollSpeed||4) + 1); });

    var sv = state.services.find(function(x){ return x.id===v.serviceId; });
    var songCount = (sv && sv.songs) ? sv.songs.length : 0;
    var prevBtn = document.getElementById('playerPrev');
    if(prevBtn) prevBtn.addEventListener('click', function(){ if(v.index>0) openSongPlayer(v.serviceId, v.index-1); });
    var nextBtn = document.getElementById('playerNext');
    if(nextBtn) nextBtn.addEventListener('click', function(){ if(v.index<songCount-1) openSongPlayer(v.serviceId, v.index+1); });

    /* Swipe left/right to move to the next/previous song in the setlist. */
    var modalEl = modalRoot.querySelector('.modal');
    if(modalEl){
      var touchStartX = null, touchStartY = null;
      modalEl.addEventListener('touchstart', function(e){
        if(e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      }, {passive:true});
      modalEl.addEventListener('touchend', function(e){
        if(touchStartX === null) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
        touchStartX = null;
        if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
          if(dx < 0 && v.index < songCount - 1) openSongPlayer(v.serviceId, v.index + 1);
          else if(dx > 0 && v.index > 0) openSongPlayer(v.serviceId, v.index - 1);
        }
      }, {passive:true});
    }
  }
  else if(v.type === 'songForm'){
    document.getElementById('cancelSong').addEventListener('click', closeModal);
    document.getElementById('saveSong').addEventListener('click', function(){
      var data = {
        title: document.getElementById('f_title').value.trim(),
        artist: document.getElementById('f_artist').value.trim(),
        key: document.getElementById('f_key').value.trim(),
        tags: document.getElementById('f_tags').value.split(',').map(function(t){return t.trim();}).filter(Boolean),
        body: document.getElementById('f_body').value,
        notes: document.getElementById('f_notes').value.trim()
      };
      if(!data.title){ toast('Ponle un título a la canción.'); return; }
      saveSong(v.id, data);
    });
  }
  else if(v.type === 'serviceDetail'){
    var d = v.draft;
    modalRoot.querySelectorAll('[data-song-tr]').forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.getAttribute('data-song-tr').split(':');
        var i = +parts[0], dir = +parts[1];
        d.songs[i].key = transposeToken(d.songs[i].key || 'C', dir, false);
        renderModal();
      });
    });
    modalRoot.querySelectorAll('[data-song-move]').forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.getAttribute('data-song-move').split(':');
        var i = +parts[0], dir = +parts[1], j = i+dir;
        var tmp = d.songs[i]; d.songs[i] = d.songs[j]; d.songs[j] = tmp;
        renderModal();
      });
    });
    modalRoot.querySelectorAll('[data-song-rm]').forEach(function(b){
      b.addEventListener('click', function(){ d.songs.splice(+b.getAttribute('data-song-rm'),1); renderModal(); });
    });
    modalRoot.querySelectorAll('[data-mus-rm]').forEach(function(b){
      b.addEventListener('click', function(){ d.assignments.splice(+b.getAttribute('data-mus-rm'),1); renderModal(); });
    });
    document.getElementById('addSongToService').addEventListener('click', function(){
      state.view = {type:'songPicker', q:'', back: v};
      renderModal();
    });
    document.getElementById('addMusToService').addEventListener('click', function(){
      state.view = {type:'musicianPicker', back: v};
      renderModal();
    });
    document.getElementById('saveService').addEventListener('click', function(){
      d.label = document.getElementById('sv_label').value.trim() || 'Culto';
      d.date = document.getElementById('sv_date').value;
      d.time = document.getElementById('sv_time').value;
      d.notes = document.getElementById('sv_notes').value.trim();
      if(!d.date){ toast('Elegí una fecha para el culto.'); return; }
      saveService(v.id, d);
    });
    var delSv = document.getElementById('delService');
    if(delSv) delSv.addEventListener('click', function(){
      if(confirm('¿Eliminar este culto? Se perderá el registro de esta fecha.')) deleteService(v.id);
    });
  }
  else if(v.type === 'songPicker'){
    var search = document.getElementById('pickerSearch');
    search.addEventListener('input', function(e){ v.q = e.target.value; renderModal(); });
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
    document.getElementById('cancelPicker').addEventListener('click', function(){ state.view = v.back; renderModal(); });
    modalRoot.querySelectorAll('[data-pick-song]').forEach(function(el){
      el.addEventListener('click', function(){
        var song = state.songs.find(function(x){return x.id===el.getAttribute('data-pick-song');});
        v.back.draft.songs = v.back.draft.songs || [];
        v.back.draft.songs.push({songId: song.id, title: song.title, key: song.key || ''});
        state.view = v.back; renderModal();
      });
    });
  }
  else if(v.type === 'musicianPicker'){
    document.getElementById('cancelPicker').addEventListener('click', function(){ state.view = v.back; renderModal(); });
    modalRoot.querySelectorAll('[data-pick-mus]').forEach(function(el){
      el.addEventListener('click', function(){
        var m = state.musicians.find(function(x){return x.id===el.getAttribute('data-pick-mus');});
        v.back.draft.assignments = v.back.draft.assignments || [];
        v.back.draft.assignments.push({musicianId: m.id, name: m.name, role: m.role || ''});
        state.view = v.back; renderModal();
      });
    });
  }
  else if(v.type === 'musicianForm'){
    document.getElementById('saveMusician').addEventListener('click', function(){
      var data = {
        name: document.getElementById('m_name').value.trim(),
        role: document.getElementById('m_role').value.trim(),
        phone: document.getElementById('m_phone').value.trim(),
        notes: document.getElementById('m_notes').value.trim()
      };
      if(!data.name){ toast('Ponle un nombre al músico.'); return; }
      saveMusician(v.id, data);
    });
    var delM = document.getElementById('delMusician');
    if(delM) delM.addEventListener('click', function(){
      if(confirm('¿Eliminar a este músico del equipo?')) deleteMusician(v.id);
    });
  }
}

/* ---------------- Persistence ---------------- */
function saveSong(id, data){
  data.updatedAt = new Date().toISOString();
  if(id){
    if(db) db.collection('songs').doc(id).set(data).catch(onDbError);
    else { var idx = state.songs.findIndex(function(x){return x.id===id;}); state.songs[idx] = Object.assign({id:id}, data); render(); }
    toast('Canción actualizada.');
  } else {
    data.createdAt = data.updatedAt;
    if(db) db.collection('songs').add(data).catch(onDbError);
    else { data.id = uid(); state.songs.push(data); render(); }
    toast('Canción agregada.');
  }
  closeModal();
}
function deleteSong(id){
  if(db) db.collection('songs').doc(id).delete().catch(onDbError);
  else { state.songs = state.songs.filter(function(x){return x.id!==id;}); render(); }
  closeModal(); toast('Canción eliminada.');
}
function saveService(id, data){
  var payload = {
    date: data.date, time: data.time||'', label: data.label,
    songs: data.songs||[], songIds: (data.songs||[]).map(function(s){return s.songId;}),
    assignments: data.assignments||[], notes: data.notes||'',
    updatedAt: new Date().toISOString()
  };
  if(id){
    if(db) db.collection('services').doc(id).set(payload).catch(onDbError);
    else { var idx = state.services.findIndex(function(x){return x.id===id;}); state.services[idx] = Object.assign({id:id}, payload); render(); }
    toast('Culto actualizado.');
  } else {
    payload.createdAt = payload.updatedAt;
    if(db) db.collection('services').add(payload).catch(onDbError);
    else { payload.id = uid(); state.services.push(payload); render(); }
    toast('Culto creado.');
  }
  closeModal();
}
function deleteService(id){
  if(db) db.collection('services').doc(id).delete().catch(onDbError);
  else { state.services = state.services.filter(function(x){return x.id!==id;}); render(); }
  closeModal(); toast('Culto eliminado.');
}
function saveMusician(id, data){
  data.updatedAt = new Date().toISOString();
  if(id){
    if(db) db.collection('musicians').doc(id).set(data).catch(onDbError);
    else { var idx = state.musicians.findIndex(function(x){return x.id===id;}); state.musicians[idx] = Object.assign({id:id}, data); render(); }
    toast('Músico actualizado.');
  } else {
    data.createdAt = data.updatedAt;
    if(db) db.collection('musicians').add(data).catch(onDbError);
    else { data.id = uid(); state.musicians.push(data); render(); }
    toast('Músico agregado.');
  }
  closeModal();
}
function deleteMusician(id){
  if(db) db.collection('musicians').doc(id).delete().catch(onDbError);
  else { state.musicians = state.musicians.filter(function(x){return x.id!==id;}); render(); }
  closeModal(); toast('Músico eliminado.');
}
function onDbError(e){
  console.error(e);
  toast('No se pudo guardar. ' + (e && e.message ? e.message : 'Intenta de nuevo.'));
}

var FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

function attachSnapshot(colName, arrKey){
  db.collection(colName).onSnapshot(function(snap){
    state[arrKey] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(err){
    console.error(colName, err);
    toast('Se perdió la conexión con los datos guardados.');
  });
}

function initDemo(){
  state.demo = true;
  document.getElementById('demoBanner').style.display = 'block';
  var demoId = uid();
  state.songs = [Object.assign({id: demoId}, DEMO_SONG)];
  state.musicians = [];
  state.services = [];
  render();
}

function boot(){
  if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId || typeof firebase === 'undefined'){
    initDemo();
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    attachSnapshot('songs','songs');
    attachSnapshot('services','services');
    attachSnapshot('musicians','musicians');
    render();
  } catch(e){
    console.error('Firebase init failed', e);
    initDemo();
  }
}

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if(!b) return;
  state.tab = b.getAttribute('data-tab');
  render();
});
document.getElementById('fab').addEventListener('click', function(){
  if(state.tab === 'songs') openSongForm(null);
  else if(state.tab === 'services') openServiceDetail(null);
  else openMusicianForm(null);
});

render();
boot();

})();
